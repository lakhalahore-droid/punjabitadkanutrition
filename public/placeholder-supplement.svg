  <rect x="145" y="170" width="110" height="90" rx="10" fill="white"/>
  <rect x="155" y="185" width="90" height="8" rx="4" fill="#f97316"/>
  <rect x="165" y="202" width="70" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="170" y="216" width="60" height="6" rx="3" fill="#cbd5e1"/>
  <path d="M190 238 L200 228 L210 238" stroke="#16a34a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Verified Badge -->
  <g transform="translate(200, 345)">
    <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#ea580c">PUNJABI TADKA NUTRITION</text>
    <text y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">100% Authentic Supplements</text>
